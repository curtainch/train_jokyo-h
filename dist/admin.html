<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桧山線 管理ページ</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h2 {
      margin-top: 2rem;
    }

    .section {
      margin-bottom: 2rem;
      padding: 1rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .station-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    select {
      padding: 0.3rem;
    }

    button {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #logout {
      background: #dc3545;
    }

    #operatingToggleSection {
      margin-top: 1rem;
      padding: 1rem;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 10px;
    }
    #toggleOperating {
      transform: scale(1.5);
      margin-left: 1rem;
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-Bsg_yiYI.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <h1>桧山線 管理ページ</h1>
 <a href="admin-delay.html">遅延証管理ページ</a>
  <div id="adminPanel" style="display: none;">
    <button id="resetAll">全て通常に戻す</button>

    <div id="operatingToggleSection" style="display: none;">
      <label>
        全体運行中 <input type="checkbox" id="toggleOperating">
      </label>
    </div>

    <div id="sections"></div>
    <button id="logout">ログアウト</button>
  </div>

  <div id="loginPanel">
    <h2>ログイン</h2>
    <input type="email" id="email" placeholder="メールアドレス"><br>
    <input type="password" id="password" placeholder="パスワード"><br>
    <button id="login">ログイン</button>
  </div>

</body>
</html>
