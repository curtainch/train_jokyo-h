<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桧山線 遅延情報管理ページ</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }
    h1 {
      margin-bottom: 1rem;
    }
    #logout {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    #logout:hover {
      background: #b52a2a;
    }
    .delay-list {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 1rem;
    }
    .delay-item {
      border-bottom: 1px solid #ddd;
      padding: 0.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delay-item:last-child {
      border-bottom: none;
    }
    button.delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
    }
    button.delete-btn:hover {
      background: #b52a2a;
    }
    form {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    form > div {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.3rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button.submit-btn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
    }
    button.submit-btn:hover {
      background: #0056b3;
    }
  </style>
  <script type="module" crossorigin src="/assets/adminDelay-BRkts5-8.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <h1>桧山線 遅延情報管理ページ</h1>

  <div id="delayList" class="delay-list">
    <h2>登録済み遅延情報</h2>
    <div id="delayItems">読み込み中...</div>
  </div>

  <form id="delayForm">
    <h2>新しい遅延情報を登録</h2>
    <div>
      <label for="delayTitle">タイトル</label>
      <input type="text" id="delayTitle" maxlength="100" required />
    </div>
    <div>
      <label for="delayDate">日付 (例: 2025-07-23T14:30)</label>
      <input type="datetime-local" id="delayDate" required />
    </div>
    <div>
      <label for="delayMinutes">遅延時間（分）</label>
      <input type="number" id="delayMinutes" min="0" step="1" required />
    </div>
    <div>
      <label for="delayDescription">内容</label>
      <textarea id="delayDescription" rows="4" maxlength="500" required></textarea>
    </div>
    <button type="submit" class="submit-btn">登録</button>
  </form>

  <button id="logout">ログアウト</button>

</body>
</html>
