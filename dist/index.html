<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桧山線 運行状況</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f9f9f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 1.5em;
    }

    .legend {
      margin-bottom: 1em;
      padding: 10px;
      background: #eee;
      border-radius: 10px;
      line-height: 1.6;
    }

    .legend span {
      display: inline-block;
      width: 1em;
      height: 1em;
      margin-right: 0.4em;
      border-radius: 50%;
      vertical-align: middle;
    }

    .diagram {
      display: flex;
      flex-direction: row;
      align-items: center;
      margin-top: 30px;
      justify-content: center;
    }

    .station {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
      flex: 0 0 auto;
    }

    .circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      border: 2px solid black;
      margin-bottom: 8px;
    }

    .line {
      width: 40px;
      height: 4px;
      background: #ccc;
      transition: background 0.3s, box-shadow 0.3s;
      margin: 0 10px;
    }

    .line.normal {
      background: green;
      box-shadow: 0 0 10px rgba(0, 128, 0, 0.6);
    }

    .line.delay {
      background: orange;
      box-shadow: 0 0 10px rgba(255, 165, 0, 0.6);
    }

    .line.stop {
      background: red;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
    }

    .status-box {
      background: #eee;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      line-height: 1.5;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      height: 2em;
    }

    #scrollWrapper {
      position: relative;
      width: 100%;
      height: 2em;
      overflow: hidden;
    }

    .scroll-text {
      display: inline-block;
      white-space: nowrap;
      font-size: 16px;
      position: absolute;
      top: 0;
      left: 0;
      padding-left: 100%;
      will-change: transform;
      animation: scroll-left 30s linear infinite;
    }

    #scrollMessage2 {
      animation-delay: 15s;
    }

    @keyframes scroll-left {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    @media (max-width: 768px) {
      #diagramContainer {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
      }

      .diagram {
        flex-wrap: nowrap;
        justify-content: flex-start;
        width: max-content;
      }

      .scroll-text {
        font-size: 14px;
      }
    }

    /* メニュー */
    #menuToggle {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      border-radius: 6px;
      padding: 5px 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 2001;
    }

    #menuOverlay {
      position: fixed;
      top: 0;
      right: 0;
      width: 250px;
      height: 100%;
      background: #fff;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.4s ease;
      z-index: 2000;
      padding: 2rem 1.5rem;
      box-sizing: border-box;
    }

    #menuOverlay.open {
      transform: translateX(0);
    }

    #menuOverlay .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      z-index: 2002;
    }

    #menuOverlay a {
      display: block;
      margin: 20px 0;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }

    #menuOverlay a:hover {
      text-decoration: underline;
    }


  </style>
  <script type="module" crossorigin src="/assets/index-BWZQ_6-g.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <!-- ☰ボタン -->
  <div id="menuToggle">☰</div>

  <!-- スライドメニュー -->
  <div id="menuOverlay">
    <span class="close-btn">×</span>
    <a href="index.html">運行状況</a>
    <a href="delay.html">遅延証明書発行</a>
    <a href="https://discord.gg/gb7gDN5Z88" target="_blank">公式Discord</a>
  </div>

  <h1 id="title">桧山線 運行状況</h1>
  <h2 id="attention">※これはRoblox上の鉄道です。実在する人物・団体等とは関係ありません。</h2>

  <div class="legend">
    <p><span style="background: green;"></span>通常運行</p>
    <p><span style="background: orange;"></span>遅延</p>
    <p><span style="background: red;"></span>運転見合わせ</p>
  </div>

  <div id="diagramContainer"></div>

  <div id="statusDescription" class="status-box">
    <div id="scrollWrapper">
      <div id="scrollMessage1" class="scroll-text">運行状況を取得中...</div>
      <div id="scrollMessage2" class="scroll-text">運行状況を取得中...</div>
    </div>
  </div>

  <!-- メニュー開閉スクリプト -->
  <script>
const toggle = document.getElementById("menuToggle");
const overlay = document.getElementById("menuOverlay");
const closeBtn = overlay.querySelector(".close-btn");

toggle.addEventListener("click", () => {
  overlay.classList.add("open");
  toggle.style.display = "none"; // メニュー開いたら非表示に
});

closeBtn.addEventListener("click", () => {
  overlay.classList.remove("open");
  toggle.style.display = "block"; // メニュー閉じたら表示に戻す
});

  </script>

  <!-- Firebaseスクリプト -->
</body>
</html>
